<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>任务规则验证</title>
<style>
body{margin:0;background:#f3f5f8;color:#243247;font:16px/1.65 "Microsoft YaHei",sans-serif}main{max-width:1120px;margin:32px auto;padding:0 24px}section{background:white;border-radius:12px;padding:24px;margin:18px 0}h1{font-size:28px}h2{font-size:21px}a{color:#245b9e}button{background:#245b9e;color:white;border:0;border-radius:6px;padding:12px 24px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}input,select{font-size:15px;padding:8px;max-width:95%}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #dfe5ed;text-align:left;overflow-wrap:anywhere;vertical-align:top}th{background:#eef2f7}.muted{font-size:14px;color:#5d6b7e}.error{color:#a32020}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{padding:12px 0;border-bottom:1px solid #dfe5ed}.table-wrap{overflow:auto}[hidden]{display:none!important}
</style></head><body><main>
<p><a href="/">返回案例数据导入</a></p><h1>任务规则验证</h1>
<p>导入任务事实和规则台账，查看需求结论、判断依据及缺失条件。</p>
<section><h2>1. 准备Excel</h2><p><a href="/rules-example.xlsx" download>下载规则验证示例</a>　<a href="/rules-blank.xlsx" download>下载空白模板</a></p>
<p class="muted">示例是普通文件审核流程的技术测试。五张表分别登记任务、事实、规则、条件和预期结果。同一规则的多行条件同时成立时才推出结论。对照用例可以留空。</p>
<h2>2. 导入并验证</h2><input type="file" id="file" accept=".xlsx"><button id="run">导入并验证</button><p id="status" role="status"></p></section>
<div id="results" hidden><section><h2>本次验证</h2><p id="scope"></p><p id="overview"></p><p class="muted" id="output"></p><details><summary>输入依据</summary><p id="filename"></p><pre id="sha"></pre></details></section>
<section><h2>3. 查看任务结论与解释</h2><label>选择任务 <select id="task"></select></label><p id="task-status"></p><p id="conclusions"></p><p id="missing"></p><p id="pending"></p>
<h3>输入事实</h3><div class="table-wrap"><table><thead><tr><th>字段</th><th>原值</th><th>单位</th><th>来源</th></tr></thead><tbody id="facts"></tbody></table></div><h3>逐条规则解释</h3><div id="explanations"></div></section>
<section><h2>4. 规则台账</h2><div class="table-wrap"><table><thead><tr><th>规则</th><th>需求结论</th><th>依据类别</th><th>来源及位置</th><th>确认状态</th><th>说明</th></tr></thead><tbody id="ledger"></tbody></table></div></section>
<section><h2>5. 对照用例</h2><p id="case-summary"></p><div class="table-wrap"><table><thead><tr><th>用例／任务／规则</th><th>预期状态</th><th>实际状态</th><th>预期需求结论</th><th>实际需求结论</th><th>核对结果</th></tr></thead><tbody id="cases"></tbody></table></div></section></div>
</main><script>
const $=id=>document.getElementById(id);
const states={pass:'条件成立',fail:'条件不成立',unknown:'信息不足',skipped:'已停用',matched:'已推出结论',no_match:'未命中规则，不能据此判断不需要',needs_information:'存在待补信息，当前结论为部分结果'};
let report=null;
function showValue(value){return value===null||value===undefined?'未填写':typeof value==='object'?JSON.stringify(value):String(value)}
function row(parent,values){const tr=document.createElement('tr');for(const value of values){const td=document.createElement('td');td.textContent=showValue(value);tr.append(td)}parent.append(tr)}
function paragraph(parent,value){const p=document.createElement('p');p.textContent=value;parent.append(p)}
function showTask(){const task=report?.tasks[Number($('task').value)];if(!task)return;
for(const id of ['facts','explanations'])$(id).replaceChildren();
$('task-status').textContent='状态：'+states[task.status];$('conclusions').textContent='需求结论：'+(task.conclusions.join('、')||'未推出；不代表不需要');
$('missing').textContent='缺失条件：'+(task.missing.join('、')||'没有缺失字段；仍需查看类型、单位或规则确认状态');$('pending').textContent='待确认规则：'+(task.pending_rules.join('、')||'无');
for(const [field,fact]of Object.entries(task.facts))row($('facts'),[field,fact.value,fact.unit,fact.source]);
for(const item of task.rules){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent=`${item.rule.id} · ${states[item.status]} · ${item.rule.conclusion}`;details.append(summary);
paragraph(details,`${item.rule.basis}；${item.rule.source} / ${item.rule.location}；${item.rule.status}`);if(item.rule.note)paragraph(details,item.rule.note);
for(const check of item.checks){const c=check.condition;paragraph(details,`${c.field} ${c.op} ${showValue(c.expected.value)} ${c.expected.unit}；实际：${showValue(check.actual?.value)} ${check.actual?.unit??''}；${check.reason}`)}$('explanations').append(details)}}
function render(data){report=data;for(const id of ['task','ledger','cases'])$(id).replaceChildren();$('scope').textContent=data.scope;$('filename').textContent=data.filename;$('sha').textContent=data.input_sha256;$('output').textContent='本次结果目录：'+data.output;
$('overview').textContent=`任务 ${data.tasks.length} 项，规则 ${data.ledger.length} 条；信息不足的任务 ${data.tasks.filter(t=>t.status==='needs_information').length} 项。`;
data.tasks.forEach((task,index)=>{const option=document.createElement('option');option.value=index;option.textContent=task.id+(task.description?' · '+task.description:'');$('task').append(option)});
for(const rule of data.ledger)row($('ledger'),[rule.id,rule.conclusion,rule.basis,rule.source+' / '+rule.location,rule.status,rule.note]);
for(const c of data.cases){const reason=c.matches?'一致':[!c.status_matches?'状态不一致':'',!c.conclusion_matches?'结论不一致':''].filter(Boolean).join('、');row($('cases'),[`${c.id} / ${c.task} / ${c.rule}`,states[c.expected],states[c.actual],c.expected_conclusion??'无结论',c.actual_conclusion??'无结论',reason])}
$('case-summary').className=data.cases.some(c=>!c.matches)?'error':'';
$('case-summary').textContent=data.cases.length?`${data.case_validation.matched} / ${data.case_validation.total} 项状态与结论均一致，不一致 ${data.case_validation.mismatched} 项。这里只核对独立登记的预期，不证明来源事实真实。`:'未登记对照用例；不作为验证通过。';showTask();$('results').hidden=false}
$('task').onchange=showTask;
$('run').onclick=async()=>{report=null;$('results').hidden=true;$('status').className='';const file=$('file').files[0];if(!file||!file.name.toLowerCase().endsWith('.xlsx')){$('status').textContent='请选择规则模板格式的.xlsx文件。';return}$('run').disabled=true;$('status').textContent='正在读取事实、核对规则并生成解释……';try{const response=await fetch('/review-rules?'+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});const data=await response.json();if(!response.ok)throw Error(data.error);render(data);$('status').textContent='验证完成，请查看任务结论和逐条解释。'}catch(error){$('status').className='error';$('status').textContent=error.message}finally{$('run').disabled=false}};
</script></body></html>
