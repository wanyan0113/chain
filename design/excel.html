<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel链网设计</title>
<style>
body{max-width:1120px;margin:32px auto;padding:0 20px;font:16px/1.65 system-ui;color:#243247;background:#f6f8fb}h1{font-size:28px}h2{font-size:21px}a{color:#245f9e}section{background:white;padding:20px;margin:18px 0;border:1px solid #dce3ec;border-radius:10px}button{background:#284466;color:white;border:0;border-radius:5px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.5}input{max-width:100%;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;text-align:left;border-bottom:1px solid #dce3ec}th{background:#edf2f8}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}details{margin:14px 0}summary{cursor:pointer;color:#245f9e}.scroll{overflow:auto}.error{color:#ab2525}[hidden]{display:none!important}.path{padding:12px;background:#edf2f8;overflow-wrap:anywhere}
</style>
<nav><a href="/">案例录入</a> · <a href="/rules">通用规则验证</a></nav>
<h1>Excel生成法术链与奥术网</h1>
<p>填写任务、能力规则、法器、指标与协同关系，生成候选链，并按共享资源约束选择网络。</p>
<section><h2>1. 下载并填写模板</h2>
<p><a href="/design-example.xlsx">下载双任务示例</a>　<a href="/design-blank.xlsx">下载空白模板</a></p>
<p>示例使用虚构工程配置，用于演示流程。请阅读模板中的“填写指南”，明确填写规则来源、阈值、单位及资源配置。</p>
<h2>2. 上传并生成</h2><input id="file" type="file" accept=".xlsx"><br><button id="run">生成链与网</button>
<p id="status" role="status" aria-live="polite"></p></section>
<div id="results" hidden><section><h2>3. 设计结果</h2><p id="overview"></p><p id="scope"></p><p id="export"></p><p id="network"></p><div id="tasks"></div></section>
<section><h2>资源冲突与计算记录</h2><pre id="search"></pre><details><summary>完整推理证据与来源</summary><pre id="evidence"></pre></details><details><summary>文字报告</summary><pre id="summary"></pre></details><h2>文件保存位置</h2><p class="path" id="output"></p></section></div>
<script>
const $=id=>document.getElementById(id);
function table(parent,headers,rows){const wrap=document.createElement('div');wrap.className='scroll';const t=document.createElement('table');const head=document.createElement('tr');for(const h of headers){const th=document.createElement('th');th.textContent=h;head.append(th)}const thead=document.createElement('thead');thead.append(head);t.append(thead);const body=document.createElement('tbody');for(const row of rows){const tr=document.createElement('tr');for(const v of row){const td=document.createElement('td');td.textContent=v;tr.append(td)}body.append(tr)}t.append(body);wrap.append(t);parent.append(wrap)}
const statuses={complete:'设计完成',blocked:'等待补充信息',no_feasible_design:'当前约束下无可行方案'};
function show(data){const r=data.report;$('overview').textContent=`${statuses[r.status]??r.status}。能力映射 ${r.ontology_mapping.mapped}/${r.ontology_mapping.total}。`;$('scope').textContent=r.scope;$('export').textContent=`RDF：${data.rdf_export.reason}`;
$('network').textContent=r.network?`选中网络：${r.network.chains.join('、')}；平均评分 ${r.network.score}；计划跨度 ${r.network.makespan_s} 秒；使用成本 ${r.network.cost_per_execution} ${r.network.cost_unit}。`:'尚未选出完整网络。';
for(const task of r.tasks){const h=document.createElement('h2');h.textContent=`任务 ${task.task}`;$('tasks').append(h);const p=document.createElement('p');p.textContent=`目标：${task.target}；候选链 ${task.chains.length} 条`;$('tasks').append(p);
table($('tasks'),['候选链','闭合路径','时间秒','精度乘积','成本','评分','选中'],task.chains.map(c=>[c.id,c.closed_path.join(' → '),c.metrics?.time??'未知',c.metrics?.accuracy??'未知',c.metrics?.cost??'未知',c.score??'未评分',r.network?.chains.includes(c.id)?'是':'否']));
if(task.blockers.length){const b=document.createElement('pre');b.textContent='阻塞原因：\n'+JSON.stringify(task.blockers,null,2);$('tasks').append(b)}}
$('search').textContent=JSON.stringify(r.network_search,null,2);$('evidence').textContent=JSON.stringify(r,null,2);$('summary').textContent=data.summary;$('output').textContent=data.output;$('results').hidden=false;}
$('run').onclick=async()=>{$('results').hidden=true;$('tasks').replaceChildren();$('status').className='';const file=$('file').files[0];if(!file||!file.name.toLowerCase().endsWith('.xlsx')){$('status').textContent='请选择.xlsx文件。';return}$('run').disabled=true;$('status').textContent='正在检查输入并计算候选链和资源约束……';try{const response=await fetch('/design-run?'+encodeURIComponent(file.name),{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});const data=await response.json();if(!response.ok)throw Error(data.error);show(data);$('status').textContent='计算结束，请查看结果及待补充信息。'}catch(e){$('status').className='error';$('status').textContent=e.message}finally{$('run').disabled=false}};
</script></html>
